<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>猫猫世界 · 跨场景同步原型</title>
  <style>
    :root {
      --bg: #090c18;
      --panel: rgba(19, 23, 43, .82);
      --panel-strong: #161b34;
      --panel-soft: #202748;
      --line: rgba(142, 160, 235, .17);
      --text: #f5f6ff;
      --muted: #929abd;
      --primary: #8d7aff;
      --primary-2: #b89cff;
      --cyan: #46d9ff;
      --mint: #65e3be;
      --yellow: #ffd76e;
      --orange: #ff9b6a;
      --danger: #ff708c;
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      --radius: 24px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      color: var(--text);
      background:
        radial-gradient(circle at 6% 0%, rgba(104, 83, 255, .22), transparent 31rem),
        radial-gradient(circle at 91% 16%, rgba(28, 181, 223, .13), transparent 28rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    a { color: inherit; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 250px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 28px 18px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      border-right: 1px solid var(--line);
      background: rgba(9, 12, 24, .75);
      backdrop-filter: blur(22px);
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 16px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: #fff;
      background: linear-gradient(135deg, #8d7aff, #4d9dff);
      box-shadow: 0 12px 28px rgba(93, 111, 255, .35);
      font-size: 23px;
    }

    .brand strong { display: block; letter-spacing: .02em; }
    .brand small { color: var(--muted); font-size: 11px; }

    .side-label {
      color: #697196;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 10px;
      padding: 0 12px;
    }

    .nav {
      display: grid;
      gap: 8px;
    }

    .nav button {
      border: 1px solid transparent;
      color: var(--muted);
      background: transparent;
      padding: 13px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-radius: 15px;
      text-align: left;
      transition: .2s ease;
    }

    .nav button:hover,
    .nav button.active {
      color: var(--text);
      background: linear-gradient(100deg, rgba(132, 114, 255, .23), rgba(132, 114, 255, .07));
      border-color: rgba(142, 126, 255, .28);
      transform: translateX(2px);
    }

    .nav .nav-icon { width: 22px; font-size: 18px; text-align: center; }
    .nav .nav-copy { flex: 1; }
    .nav .nav-copy strong { display: block; font-size: 13px; }
    .nav .nav-copy small { display: block; color: #737ca6; font-size: 10px; margin-top: 2px; }

    .side-bottom { margin-top: auto; display: grid; gap: 14px; }

    .sync-card {
      padding: 14px;
      border: 1px solid rgba(98, 230, 191, .2);
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(67, 222, 178, .11), rgba(67, 222, 178, .04));
    }

    .sync-card .sync-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 12px; }
    .sync-dot { width: 8px; height: 8px; border-radius: 99px; background: var(--mint); box-shadow: 0 0 0 5px rgba(101, 227, 190, .1), 0 0 16px var(--mint); }
    .sync-card p { margin: 8px 0 0; color: #9cceb9; font-size: 11px; line-height: 1.6; }

    .reset-button {
      color: #8f97bd;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.03);
      border-radius: 12px;
      padding: 9px 11px;
      font-size: 11px;
    }
    .reset-button:hover { color: var(--text); border-color: rgba(255,255,255,.3); }

    .main {
      min-width: 0;
      padding: 22px 34px 36px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      max-width: 1480px;
      margin: 0 auto 24px;
    }

    .crumbs { color: var(--muted); font-size: 12px; }
    .crumbs strong { color: var(--text); font-size: 13px; margin-left: 6px; }

    .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .resource-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 9px 11px;
      background: rgba(255,255,255,.045);
      color: #ccd1f0;
      font-size: 12px;
    }
    .resource-pill strong { color: var(--text); }
    .player-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 13px;
      padding: 4px 10px 4px 5px;
      background: rgba(255,255,255,.05);
      border: 1px solid var(--line);
      font-size: 12px;
    }
    .player-pill .mini-avatar { width: 27px; height: 27px; font-size: 16px; }

    .view {
      max-width: 1480px;
      margin: 0 auto;
      animation: rise .35s ease both;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    .hero {
      min-height: 198px;
      padding: 30px 34px;
      border: 1px solid rgba(144, 126, 255, .25);
      border-radius: 28px;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(115deg, rgba(83, 69, 200, .72), rgba(24, 47, 99, .52) 58%, rgba(16, 106, 140, .39)),
        radial-gradient(circle at 88% 10%, rgba(99, 235, 255, .4), transparent 15rem);
      box-shadow: var(--shadow);
    }
    .hero::after {
      content: "✦  ◌  ⋆  ·  ✧";
      position: absolute;
      right: 26px;
      top: 24px;
      color: rgba(255,255,255,.43);
      letter-spacing: 26px;
      font-size: 21px;
      transform: rotate(10deg);
    }
    .hero h1 { margin: 0; max-width: 660px; font-size: clamp(26px, 3.2vw, 44px); line-height: 1.13; letter-spacing: -.04em; }
    .hero p { color: #d2d5fa; max-width: 640px; margin: 14px 0 22px; line-height: 1.7; font-size: 13px; }
    .hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .button {
      border: 1px solid transparent;
      border-radius: 13px;
      padding: 11px 15px;
      font-weight: 800;
      font-size: 12px;
      transition: .2s ease;
    }
    .button:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .button.primary { color: #fff; background: linear-gradient(135deg, #8f79ff, #596bff); box-shadow: 0 12px 26px rgba(100, 96, 255, .25); }
    .button.secondary { color: #dde0ff; background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.16); }
    .button.ghost { color: #aeb6df; background: transparent; border-color: var(--line); }
    .button.mint { color: #0b211c; background: linear-gradient(135deg, #77f1c9, #5ad7ad); }
    .button.orange { color: #30150e; background: linear-gradient(135deg, #ffd47f, #ff946e); }
    .button.danger { color: #fff; background: linear-gradient(135deg, #ff7691, #da496c); }
    .button:disabled { opacity: .42; pointer-events: none; }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin: 28px 0 13px;
    }
    .section-head h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; }
    .section-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .section-head .eyebrow { color: #8c83df; text-transform: uppercase; letter-spacing: .15em; font-size: 10px; font-weight: 800; }

    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, .9fr); gap: 18px; align-items: start; }

    .card {
      border: 1px solid var(--line);
      background: linear-gradient(145deg, rgba(26, 31, 59, .88), rgba(16, 20, 39, .76));
      border-radius: var(--radius);
      box-shadow: 0 15px 42px rgba(0,0,0,.16);
    }
    .card-pad { padding: 19px; }
    .stat-card { min-height: 100px; padding: 17px; position: relative; overflow: hidden; }
    .stat-card::after { content: attr(data-icon); position: absolute; right: 15px; top: 10px; opacity: .15; font-size: 44px; }
    .stat-card .stat-label { color: #9098be; font-size: 11px; }
    .stat-card .stat-value { font-size: 26px; font-weight: 850; margin-top: 9px; letter-spacing: -.04em; }
    .stat-card .stat-meta { color: #777fa5; font-size: 10px; margin-top: 5px; }

    .room-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(280px, .65fr); gap: 14px; }
    .room-card { overflow: hidden; }
    .room-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .room-toolbar strong { font-size: 13px; }
    .room-toolbar span { color: var(--muted); font-size: 11px; }

    .home-scene {
      min-height: 400px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(145deg, #24274d, #192a48 55%, #213c57);
      background-size: 48px 48px, 48px 48px, auto;
    }
    .home-scene::before {
      content: "";
      position: absolute; inset: 0;
      background: radial-gradient(circle at 24% 26%, rgba(255,221,162,.18), transparent 12rem), radial-gradient(circle at 82% 76%, rgba(78,214,255,.11), transparent 15rem);
      pointer-events: none;
    }
    .window {
      position: absolute; left: 7%; top: 10%; width: 118px; height: 110px; border: 8px solid #4a517e; border-radius: 16px; background: linear-gradient(150deg, #554e91, #63bce7); box-shadow: inset 0 0 0 3px rgba(255,255,255,.2), 0 15px 22px rgba(0,0,0,.2);
    }
    .window::after { content: "☼"; display: grid; place-items: center; height: 100%; color: #ffeab2; font-size: 39px; opacity: .75; }
    .rug { position: absolute; width: 40%; height: 30%; left: 31%; bottom: 12%; border-radius: 50%; background: rgba(169, 122, 205, .36); transform: rotate(-7deg); border: 2px solid rgba(232,190,255,.22); }
    .sofa { position: absolute; right: 7%; top: 22%; width: 170px; height: 94px; border-radius: 23px 23px 14px 14px; background: #6a4f9a; box-shadow: inset 0 12px 0 rgba(255,255,255,.08), 0 18px 25px rgba(0,0,0,.22); }
    .sofa::before { content: ""; position: absolute; left: 18px; right: 18px; top: -17px; height: 27px; border-radius: 14px; background: #8b6cc3; }
    .plant { position: absolute; left: 8%; bottom: 10%; font-size: 55px; filter: drop-shadow(0 14px 8px rgba(0,0,0,.25)); }
    .table { position: absolute; right: 13%; bottom: 13%; width: 84px; height: 44px; border-radius: 50%; background: #b8795e; box-shadow: 0 24px 0 -12px #6c4a4e; }
    .scene-label { position: absolute; left: 20px; bottom: 18px; color: rgba(255,255,255,.5); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .scene-token {
      position: absolute;
      z-index: 2;
      display: grid;
      justify-items: center;
      gap: 2px;
      transition: .2s ease;
    }
    .scene-token:hover { transform: translateY(-4px) scale(1.04); }
    .scene-token .token-face { width: 47px; height: 47px; display: grid; place-items: center; border-radius: 17px; background: rgba(18, 18, 42, .72); border: 1px solid rgba(255,255,255,.32); box-shadow: 0 10px 18px rgba(0,0,0,.24); font-size: 27px; }
    .scene-token .token-name { color: #e8e8ff; font-size: 10px; background: rgba(9, 12, 24, .58); padding: 3px 6px; border-radius: 7px; white-space: nowrap; }
    .scene-token.me .token-face { border-color: #8e80ff; box-shadow: 0 0 0 4px rgba(137,123,255,.14), 0 10px 18px rgba(0,0,0,.24); }
    .scene-token.online .token-face { border-color: rgba(101,227,190,.6); }

    .online-list { display: grid; gap: 9px; }
    .player-row {
      width: 100%;
      border: 1px solid transparent;
      background: rgba(255,255,255,.035);
      color: var(--text);
      border-radius: 15px;
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      transition: .2s ease;
    }
    .player-row:hover { border-color: rgba(131, 116, 255, .45); background: rgba(128,112,255,.1); }
    .avatar {
      width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, #34416e, #544581); font-size: 21px; flex: 0 0 auto;
    }
    .player-row .player-main { min-width: 0; flex: 1; }
    .player-row strong { display: block; font-size: 12px; }
    .player-row small { display: block; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 3px; }
    .presence { width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(101,227,190,.1); }
    .presence.away { background: #ffca68; box-shadow: 0 0 0 4px rgba(255,202,104,.1); }

    .cat-card { padding: 14px; border: 1px solid var(--line); border-radius: 20px; background: rgba(255,255,255,.035); position: relative; overflow: hidden; }
    .cat-card.selected { border-color: rgba(144,126,255,.7); box-shadow: 0 0 0 3px rgba(144,126,255,.12); background: linear-gradient(145deg, rgba(124,103,255,.17), rgba(255,255,255,.03)); }
    .cat-card .cat-top { display: flex; gap: 11px; align-items: center; }
    .cat-emoji { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 17px; background: linear-gradient(135deg, #4e4779, #a3778d); font-size: 31px; }
    .cat-card h3 { margin: 0; font-size: 13px; }
    .cat-card p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .cat-level { margin-left: auto; color: #d3b7ff; font-size: 10px; }
    .bars { display: grid; gap: 7px; margin-top: 14px; }
    .bar-line { display: grid; grid-template-columns: 35px minmax(0, 1fr) 29px; align-items: center; gap: 8px; color: #8e96ba; font-size: 10px; }
    .bar { height: 6px; border-radius: 99px; background: #2b304e; overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #7e6fff, #66d7ff); }
    .bar.green > i { background: linear-gradient(90deg, #5cdda9, #b6ed87); }
    .bar.orange > i { background: linear-gradient(90deg, #ffab74, #ffd56e); }
    .cat-actions { display: flex; gap: 7px; margin-top: 14px; }
    .cat-actions button { flex: 1; padding: 8px 7px; font-size: 10px; }

    .achievement { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .achievement:last-child { border-bottom: 0; padding-bottom: 0; }
    .achievement:first-child { padding-top: 0; }
    .achievement-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 12px; background: rgba(255,215,110,.14); }
    .achievement strong { font-size: 12px; display: block; }
    .achievement small { color: var(--muted); font-size: 10px; display: block; margin-top: 3px; }
    .achievement .done { margin-left: auto; color: var(--mint); font-size: 10px; font-weight: 800; }

    .feature-card { min-height: 152px; padding: 18px; position: relative; overflow: hidden; }
    .feature-card .feature-icon { font-size: 28px; }
    .feature-card h3 { font-size: 14px; margin: 12px 0 7px; }
    .feature-card p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.55; max-width: 250px; }
    .feature-card .feature-go { position: absolute; right: 17px; bottom: 16px; color: #aaa1ff; font-size: 17px; }

    .page-title {
      display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 5px 0 22px;
    }
    .page-title h1 { font-size: 29px; line-height: 1; margin: 0; letter-spacing: -.045em; }
    .page-title p { color: var(--muted); font-size: 12px; margin: 9px 0 0; }

    .lobby-layout { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(330px, .65fr); gap: 18px; align-items: start; }
    .lobby-main { min-width: 0; }
    .arena-banner {
      min-height: 210px;
      padding: 24px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(131, 118, 255, .3);
      border-radius: 24px;
      background:
        linear-gradient(115deg, rgba(56, 41, 119, .88), rgba(19, 36, 83, .68)),
        repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 1px, transparent 1px 17px);
    }
    .arena-banner::after { content: "VS"; position: absolute; right: 44px; top: 26px; font-size: 110px; font-weight: 950; line-height: 1; color: rgba(159,139,255,.1); letter-spacing: -.13em; }
    .arena-kicker { color: #baafff; text-transform: uppercase; font-size: 10px; letter-spacing: .17em; font-weight: 800; }
    .arena-banner h2 { margin: 14px 0 8px; font-size: clamp(24px, 3vw, 39px); letter-spacing: -.055em; }
    .arena-banner p { color: #c0c5ea; font-size: 12px; max-width: 480px; line-height: 1.6; margin: 0 0 20px; }
    .room-mode-tabs { display: inline-flex; padding: 4px; border: 1px solid var(--line); background: rgba(8, 10, 22, .35); border-radius: 13px; margin-top: 18px; }
    .room-mode-tabs button { border: 0; background: transparent; color: #8f97bb; border-radius: 9px; padding: 8px 11px; font-size: 11px; }
    .room-mode-tabs button.active { background: rgba(144,126,255,.23); color: #fff; }

    .notice-card {
      padding: 15px 17px;
      border: 1px solid rgba(255, 215, 110, .28);
      background: linear-gradient(110deg, rgba(255, 203, 88, .12), rgba(255,255,255,.035));
      border-radius: 19px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 14px 0;
    }
    .notice-card .notice-icon { font-size: 23px; }
    .notice-card .notice-copy { flex: 1; }
    .notice-card strong { display: block; font-size: 12px; }
    .notice-card p { margin: 4px 0 0; color: #bfbfcd; font-size: 10px; }

    .challenge-list { display: grid; gap: 10px; }
    .challenge-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255,255,255,.035);
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
    }
    .challenge-card.incoming { border-color: rgba(255,215,110,.32); background: linear-gradient(100deg, rgba(255,215,110,.11), rgba(255,255,255,.03)); }
    .challenge-card .challenge-copy { min-width: 0; }
    .challenge-card strong { display: block; font-size: 12px; }
    .challenge-card p { margin: 4px 0 0; color: var(--muted); font-size: 10px; }
    .challenge-card .challenge-actions { display: flex; gap: 7px; flex-wrap: wrap; justify-content: flex-end; }
    .challenge-tag { color: #ffdb8c; border: 1px solid rgba(255,215,110,.2); padding: 5px 7px; border-radius: 7px; font-size: 9px; font-weight: 800; white-space: nowrap; }

    .side-panel { display: grid; gap: 14px; }
    .panel-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .panel-title h3 { margin: 0; font-size: 13px; }
    .panel-title span { color: var(--muted); font-size: 10px; }
    .loadout-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 14px 0; }
    .loadout-item { border: 1px solid var(--line); border-radius: 14px; padding: 12px; background: rgba(255,255,255,.03); }
    .loadout-item small { display: block; color: #8189aa; font-size: 9px; text-transform: uppercase; letter-spacing: .1em; }
    .loadout-item strong { display: block; font-size: 12px; margin-top: 8px; }
    .loadout-item span { display: block; color: #b5b9d8; font-size: 18px; margin-top: 5px; }
    .full-button { width: 100%; }

    .rules { display: grid; gap: 10px; }
    .rule { display: flex; align-items: flex-start; gap: 9px; color: #b9bedc; font-size: 11px; line-height: 1.45; }
    .rule b { color: #9e92ff; }

    .player-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .player-card { padding: 11px; border-radius: 15px; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
    .player-card .player-row { padding: 0; background: transparent; }
    .player-card .player-row:hover { border-color: transparent; background: transparent; transform: none; }
    .player-card button { width: 100%; margin-top: 9px; padding: 8px; font-size: 10px; }

    .battle-shell { display: grid; gap: 15px; }
    .battle-topline { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .battle-topline .battle-status { color: #aaa3ef; font-size: 11px; }
    .battle-topline .seed { color: #7e87ac; font-size: 10px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .battle-arena { border: 1px solid rgba(144,126,255,.27); border-radius: 24px; overflow: hidden; background: #11142c; }
    canvas { width: 100%; display: block; background: #15152c; }
    .battle-hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; padding: 17px; border-top: 1px solid var(--line); }
    .fighter { display: flex; align-items: center; gap: 10px; }
    .fighter.right { flex-direction: row-reverse; text-align: right; }
    .fighter .fighter-avatar { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 14px; background: linear-gradient(135deg, #5b4e8d, #395b89); font-size: 24px; }
    .fighter strong { display: block; font-size: 12px; }
    .fighter small { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .hp-wrap { min-width: 120px; margin-top: 7px; }
    .hp-bar { height: 8px; border-radius: 99px; background: #2b304f; overflow: hidden; }
    .hp-bar i { height: 100%; display: block; border-radius: inherit; background: linear-gradient(90deg, #6aebbb, #b7ef9a); }
    .fighter.right .hp-bar i { margin-left: auto; background: linear-gradient(90deg, #ffb174, #ff7187); }
    .versus { width: 36px; height: 36px; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.17); border-radius: 50%; color: #d6ceff; font-weight: 900; font-size: 12px; }
    .battle-controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .battle-log { max-height: 125px; overflow: auto; display: grid; gap: 6px; padding: 13px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.025); }
    .battle-log p { color: #adb4d7; font-size: 10px; margin: 0; }
    .battle-log p strong { color: #e8d9ff; }
    .result-card { text-align: center; padding: 30px; }
    .result-card .result-icon { font-size: 48px; }
    .result-card h2 { margin: 10px 0 8px; font-size: 25px; }
    .result-card p { color: var(--muted); font-size: 12px; margin: 0 auto 20px; max-width: 420px; line-height: 1.6; }
    .rewards { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin: 14px auto 22px; }
    .reward { display: inline-flex; gap: 6px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,215,110,.25); background: rgba(255,215,110,.08); color: #ffdf99; font-size: 11px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 100; padding: 24px; display: grid; place-items: center; background: rgba(4, 5, 13, .75); backdrop-filter: blur(10px); }
    .modal { width: min(760px, 100%); max-height: min(700px, 92vh); overflow: auto; border: 1px solid rgba(144,126,255,.4); border-radius: 24px; background: linear-gradient(145deg, #1b2041, #11152c); box-shadow: 0 30px 100px rgba(0,0,0,.52); }
    .modal-head { display: flex; align-items: center; justify-content: space-between; padding: 19px 21px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(25, 29, 58, .94); z-index: 2; }
    .modal-head h2 { margin: 0; font-size: 17px; }
    .close { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 9px; color: #a6aed0; background: rgba(255,255,255,.04); }
    .modal-body { padding: 20px; }
    .modal-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .modal-tabs button { padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; color: #a9b1d1; background: rgba(255,255,255,.04); font-size: 11px; }
    .modal-tabs button.active { color: #fff; background: rgba(133,113,255,.24); border-color: rgba(143,126,255,.5); }
    .choice-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .choice { padding: 13px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.03); text-align: left; color: var(--text); }
    .choice.selected { border-color: rgba(144,126,255,.8); background: linear-gradient(145deg, rgba(136,115,255,.2), rgba(255,255,255,.04)); box-shadow: 0 0 0 3px rgba(136,115,255,.1); }
    .choice .choice-emoji { font-size: 28px; margin-bottom: 9px; }
    .choice strong { display: block; font-size: 12px; }
    .choice small { display: block; color: var(--muted); font-size: 10px; margin-top: 5px; line-height: 1.45; }
    .modal-footer { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--line); }
    .modal-footer p { margin: 0; color: var(--muted); font-size: 10px; }

    .toast {
      position: fixed; right: 24px; bottom: 24px; z-index: 120; transform: translateY(18px); opacity: 0; pointer-events: none; transition: .25s ease;
      padding: 12px 15px; border-radius: 13px; color: #e8ecff; border: 1px solid rgba(144,126,255,.45); background: #242954; box-shadow: 0 15px 35px rgba(0,0,0,.3); font-size: 12px;
    }
    .toast.show { transform: none; opacity: 1; }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); border: 1px dashed rgba(142,160,235,.23); border-radius: 18px; }
    .empty-state .empty-icon { font-size: 32px; margin-bottom: 10px; }
    .empty-state p { margin: 0; font-size: 11px; line-height: 1.6; }
    .muted { color: var(--muted); }
    .mt-14 { margin-top: 14px; }
    .mt-18 { margin-top: 18px; }

    @media (max-width: 1100px) {
      .app-shell { grid-template-columns: 82px minmax(0, 1fr); }
      .sidebar { padding: 20px 10px; }
      .brand { justify-content: center; padding-inline: 0; }
      .brand-copy, .side-label, .nav-copy, .sync-card p, .reset-button { display: none; }
      .nav button { justify-content: center; padding-inline: 10px; }
      .side-bottom { align-items: center; }
      .sync-card { padding: 12px; }
      .sync-card .sync-head { font-size: 0; }
      .sync-card .sync-dot { width: 10px; height: 10px; }
      .room-layout, .lobby-layout, .dashboard-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .app-shell { display: block; }
      .sidebar { height: auto; position: sticky; top: 0; padding: 10px; display: block; }
      .brand { display: none; }
      .nav { display: flex; overflow-x: auto; }
      .nav button { flex: 0 0 auto; padding: 9px 12px; }
      .nav .nav-copy { display: block; }
      .nav .nav-copy small { display: none; }
      .nav .nav-icon { width: auto; }
      .side-bottom { display: none; }
      .main { padding: 17px 14px 30px; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 10px; margin-bottom: 17px; }
      .top-actions { justify-content: flex-start; }
      .hero { padding: 24px; }
      .hero::after { opacity: .25; }
      .grid-3, .grid-2, .player-grid, .choice-grid { grid-template-columns: 1fr; }
      .home-scene { min-height: 340px; }
      .sofa { transform: scale(.8); transform-origin: right top; }
      .battle-hud { grid-template-columns: 1fr; gap: 12px; }
      .versus { margin: auto; }
      .fighter.right { flex-direction: row; text-align: left; }
      .fighter.right .hp-bar i { margin-left: 0; }
      .challenge-card { grid-template-columns: auto minmax(0, 1fr); }
      .challenge-card .challenge-actions { grid-column: 1 / -1; justify-content: flex-start; }
      .page-title { align-items: flex-start; flex-direction: column; gap: 12px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" class="toast"></div>
  <script>
    const STORAGE_KEY = "cat-world-prototype-v1";
    const defaultState = {
      user: { id: "me", name: "喵球", avatar: "🐱", level: 12, exp: 68 },
      resources: { coins: 2480, food: 18, soap: 6, medicine: 4 },
      cats: [
        { id: "luna", name: "露娜", breed: "月影 · SR", emoji: "🐈‍⬛", hp: 94, happy: 82, clean: 72, level: 12, status: "在线陪伴中", rarity: "SR" },
        { id: "momo", name: "糯米", breed: "奶油 · R", emoji: "🐱", hp: 100, happy: 91, clean: 89, level: 8, status: "在猫爬架午睡", rarity: "R" },
        { id: "taro", name: "芋泥", breed: "蓝灰 · N", emoji: "😺", hp: 78, happy: 63, clean: 56, level: 5, status: "需要一点治疗", rarity: "N" }
      ],
      selectedCat: "luna",
      loadout: { weapon: "星尘爪", weaponEmoji: "🪄", armor: "云朵护甲", armorEmoji: "🛡️" },
      furniture: ["sofa", "plant", "window", "table"],
      codex: { unlocked: 12, total: 32 },
      online: [
        { id: "orange", name: "小橘", avatar: "🐈", level: 14, scene: "格斗场大厅", status: "在线", color: "orange" },
        { id: "youzi", name: "柚子汽水", avatar: "😸", level: 10, scene: "自己的家", status: "在线", color: "mint" },
        { id: "mimi", name: "咪咪队长", avatar: "😼", level: 18, scene: "射击场", status: "对战中", color: "blue" },
        { id: "pipi", name: "皮皮虾", avatar: "😽", level: 7, scene: "自己的家", status: "刚刚上线", color: "yellow" }
      ],
      ft: {
        stage: "lobby",
        incoming: { id: "ft-demo", fromId: "orange", fromName: "小橘", fromAvatar: "🐈", status: "INVITED", expires: "02:36" },
        outgoing: null,
        room: null,
        battle: null,
        result: null
      },
      shoot: {
        stage: "lobby",
        incoming: null,
        outgoing: null,
        room: null,
        battle: null,
        result: null
      },
      modal: null,
      lastSync: "刚刚"
    };

    let state = loadState();
    let toastTimer;

    function clone(value) { return JSON.parse(JSON.stringify(value)); }
    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) return Object.assign(clone(defaultState), saved);
      } catch (error) {}
      return clone(defaultState);
    }
    function persist(message) {
      state.lastSync = "刚刚";
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (message) showToast(message);
    }
    function showToast(message) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = message;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }
    function route() {
      const raw = location.hash.replace(/^#/, "") || "/";
      return raw === "/ft" ? "/ft" : raw === "/shoot" ? "/shoot" : "/";
    }
    function go(next) {
      if (route() !== next) location.hash = next;
      else render();
    }
    function selectedCat() {
      return state.cats.find(cat => cat.id === state.selectedCat) || state.cats[0];
    }
    function escapeHtml(text) {
      return String(text).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    }
    function pct(value) { return Math.max(0, Math.min(100, value)); }
    function playerById(id) { return state.online.find(player => player.id === id); }
    function button(label, action, className = "secondary", extra = "") {
      return `<button class="button ${className}" data-action="${action}" ${extra}>${label}</button>`;
    }

    function render() {
      document.getElementById("app").innerHTML = `
        <div class="app-shell">
          ${renderSidebar()}
          <main class="main">
            ${renderTopbar()}
            <div class="view">${route() === "/" ? renderWorld() : route() === "/ft" ? renderFt() : renderShoot()}</div>
          </main>
        </div>
        ${state.modal ? renderModal() : ""}
      `;
      drawCanvas();
    }

    function renderSidebar() {
      const current = route();
      return `
        <aside class="sidebar">
          <div class="brand">
            <div class="brand-mark">🐾</div>
            <div class="brand-copy"><strong>猫猫世界</strong><small>SYNCED UNIVERSE</small></div>
          </div>
          <div class="side-label">世界导航</div>
          <nav class="nav">
            <button class="${current === "/" ? "active" : ""}" data-action="go" data-route="/">
              <span class="nav-icon">🏠</span><span class="nav-copy"><strong>主世界</strong><small>养成 · 家园 · 图鉴</small></span>
            </button>
            <button class="${current === "/ft" ? "active" : ""}" data-action="go" data-route="/ft">
              <span class="nav-icon">⚔️</span><span class="nav-copy"><strong>格斗场</strong><small>PvP · 大厅优先</small></span>
            </button>
            <button class="${current === "/shoot" ? "active" : ""}" data-action="go" data-route="/shoot">
              <span class="nav-icon">🎯</span><span class="nav-copy"><strong>射击场</strong><small>PvP · 快速同步</small></span>
            </button>
          </nav>
          <div class="side-bottom">
            <div class="sync-card">
              <div class="sync-head"><span class="sync-dot"></span><span>跨设备已同步</span></div>
              <p>账号、背包与房间状态<br>实时写入 PresenceDO</p>
            </div>
            <button class="reset-button" data-action="reset-demo">↻ 重置演示数据</button>
          </div>
        </aside>
      `;
    }

    function renderTopbar() {
      return `
        <header class="topbar">
          <div class="crumbs">猫猫世界 <span>›</span><strong>${route() === "/" ? "我的家" : route() === "/ft" ? "格斗场大厅" : "射击场大厅"}</strong></div>
          <div class="top-actions">
            <span class="resource-pill">🪙 <strong>${state.resources.coins.toLocaleString()}</strong></span>
            <span class="resource-pill">🍣 <strong>${state.resources.food}</strong></span>
            <span class="resource-pill">🧼 <strong>${state.resources.soap}</strong></span>
            <span class="resource-pill">💊 <strong>${state.resources.medicine}</strong></span>
            <span class="player-pill"><span class="avatar mini-avatar">${state.user.avatar}</span><strong>${state.user.name}</strong><span class="muted">Lv.${state.user.level}</span></span>
          </div>
        </header>
      `;
    }

    function renderWorld() {
      const cat = selectedCat();
      return `
        <section class="hero">
          <div class="hero-content">
            <h1>欢迎回家，${state.user.name}。<br>今天也和猫猫一起冒险吧。</h1>
            <p>主世界、格斗场、射击场共用一套实时账号数据。你在哪里登录，猫猫、金币、装备和战绩都会跟着你。</p>
            <div class="hero-actions">
              ${button("⚔️ 进入格斗大厅", "go:/ft", "primary")}
              ${button("🎯 去射击场", "go:/shoot", "secondary")}
              ${button("📖 查看图鉴", "open-codex", "ghost")}
            </div>
          </div>
        </section>

        <div class="grid-3 mt-18">
          <div class="card stat-card" data-icon="🐾"><div class="stat-label">猫咪收藏</div><div class="stat-value">${state.cats.length}<span class="muted"> / 12</span></div><div class="stat-meta">已解锁 ${state.codex.unlocked} 条图鉴记录</div></div>
          <div class="card stat-card" data-icon="🏆"><div class="stat-label">本周成就</div><div class="stat-value">07</div><div class="stat-meta">再完成 2 个领取限定头像</div></div>
          <div class="card stat-card" data-icon="🌐"><div class="stat-label">同服在线</div><div class="stat-value">${state.online.length + 1}</div><div class="stat-meta">场景内可见，不只是数字</div></div>
        </div>

        <div class="section-head">
          <div><div class="eyebrow">LIVE HOME INSTANCE</div><h2>我的家 · 星河 07 号房</h2><p>家具布局与在线玩家实时同步，点击场景里的玩家即可拜访。</p></div>
          ${button("🪑 摆放家具", "place-furniture", "ghost")}
        </div>

        <div class="dashboard-grid">
          <div class="room-layout">
            <div class="card room-card">
              <div class="room-toolbar"><strong>家园场景 · 当前在线 ${state.online.filter(p => p.status !== "对战中").length + 1} 人</strong><span>刚刚同步 · ${state.lastSync}</span></div>
              <div class="home-scene">
                <div class="window"></div><div class="rug"></div><div class="sofa"></div><div class="plant">🪴</div><div class="table"></div>
                ${renderSceneToken("me", state.user.name, state.user.avatar, "30%", "54%", true)}
                ${renderSceneToken("orange", "小橘", "🐈", "60%", "44%")}
                ${renderSceneToken("youzi", "柚子汽水", "😸", "73%", "68%")}
                ${renderSceneToken("mimi", "咪咪队长", "😼", "13%", "75%")}
                <div class="scene-label">HOME INSTANCE / STARRY 07</div>
              </div>
            </div>
            <div class="card card-pad">
              <div class="panel-title"><h3>附近在线玩家</h3><span>可一键拜访 / 挑战</span></div>
              <div class="online-list mt-14">${state.online.map(player => renderPlayerRow(player, "visit-player")).join("")}</div>
            </div>
          </div>

          <div class="side-panel">
            <div class="card card-pad">
              <div class="panel-title"><h3>我的猫猫</h3><span>${state.cats.length} / 12</span></div>
              <div class="grid-2 mt-14">${state.cats.map(renderCatCard).join("")}</div>
            </div>
            <div class="card card-pad">
              <div class="panel-title"><h3>本周成就</h3><span>2,460 XP</span></div>
              <div class="mt-14">
                ${renderAchievement("🌟", "第一次同步出战", "跨设备完成一次 PvP", "已完成")}
                ${renderAchievement("🧼", "洁净如新", "给任意猫咪洗澡 3 次", "已完成")}
                ${renderAchievement("🚀", "星河访客", "拜访 2 位在线玩家", "1 / 2")}
              </div>
            </div>
          </div>
        </div>

        <div class="section-head"><div><div class="eyebrow">ONE ACCOUNT · THREE SCENES</div><h2>快速进入</h2></div></div>
        <div class="grid-3">
          <div class="card feature-card"><div class="feature-icon">⚔️</div><h3>格斗场 PvP</h3><p>大厅先选配置，再接受挑战。双方 PICKS 完成后用共享 seed 进入同步战斗。</p><div class="feature-go" data-action="go" data-route="/ft">→</div></div>
          <div class="card feature-card"><div class="feature-icon">🎯</div><h3>射击场 PvP</h3><p>轻量化实时对战，击杀掉落与死亡惩罚和主世界完全共用。</p><div class="feature-go" data-action="go" data-route="/shoot">→</div></div>
          <div class="card feature-card"><div class="feature-icon">📚</div><h3>图鉴与成就</h3><p>收集猫咪、家具和竞技徽章。所有进度同步到账号，不会因为切端丢失字段。</p><div class="feature-go" data-action="open-codex">→</div></div>
        </div>
      `;
    }

    function renderSceneToken(id, name, avatar, left, top, me = false) {
      const player = playerById(id);
      const online = id === "me" || player;
      return `<button class="scene-token ${me ? "me" : ""} ${online ? "online" : ""}" style="left:${left};top:${top}" data-action="${id === "me" ? "open-profile" : "visit-player"}" data-player="${id}">
        <span class="token-face">${avatar}</span><span class="token-name">${name}${me ? " · 你" : ""}</span>
      </button>`;
    }

    function renderPlayerRow(player, action) {
      return `<button class="player-row" data-action="${action}" data-player="${player.id}">
        <span class="avatar">${player.avatar}</span><span class="player-main"><strong>${player.name} <span class="muted">Lv.${player.level}</span></strong><small>${player.scene}</small></span><span class="presence ${player.status === "刚刚上线" ? "away" : ""}"></span>
      </button>`;
    }

    function renderCatCard(cat) {
      const isSelected = cat.id === state.selectedCat;
      return `<div class="cat-card ${isSelected ? "selected" : ""}">
        <div class="cat-top"><div class="cat-emoji">${cat.emoji}</div><div><h3>${cat.name}</h3><p>${cat.breed}</p></div><span class="cat-level">Lv.${cat.level}</span></div>
        <div class="bars">
          <div class="bar-line"><span>生命</span><div class="bar green"><i style="width:${cat.hp}%"></i></div><b>${cat.hp}</b></div>
          <div class="bar-line"><span>心情</span><div class="bar"><i style="width:${cat.happy}%"></i></div><b>${cat.happy}</b></div>
          <div class="bar-line"><span>清洁</span><div class="bar orange"><i style="width:${cat.clean}%"></i></div><b>${cat.clean}</b></div>
        </div>
        <div class="cat-actions">
          <button class="button ghost" data-action="feed-cat" data-cat="${cat.id}">🍣 喂食</button>
          <button class="button ghost" data-action="bathe-cat" data-cat="${cat.id}">🧼 洗澡</button>
          <button class="button ghost" data-action="heal-cat" data-cat="${cat.id}">💊 治疗</button>
        </div>
      </div>`;
    }

    function renderAchievement(icon, title, description, stateText) {
      return `<div class="achievement"><span class="achievement-icon">${icon}</span><span><strong>${title}</strong><small>${description}</small></span><span class="${stateText === "已完成" ? "done" : "muted"}">${stateText}</span></div>`;
    }

    function renderFt() {
      const ft = state.ft;
      if (ft.stage === "battle") return renderBattle("ft");
      if (ft.stage === "result") return renderResult("ft");
      const room = ft.room;
      const inPicks = ft.stage === "picks" && room;
      return `
        <div class="page-title">
          <div><h1>格斗场大厅</h1><p>默认停在大厅：先看在线玩家、出战配置和挑战卡，再进入战斗。</p></div>
          ${button("🏠 回主世界", "go:/", "ghost")}
        </div>
        ${ft.incoming ? renderIncoming("ft") : ""}
        ${ft.outgoing ? renderOutgoing("ft") : ""}
        ${inPicks ? renderPickRoom("ft") : renderFtLobby()}
      `;
    }

    function renderFtLobby() {
      return `
        <div class="lobby-layout">
          <div class="lobby-main">

    function hashString(text) {
      let hash = 2166136261;
      for (let i = 0; i < text.length; i++) { hash ^= text.charCodeAt(i); hash = Math.imul(hash, 16777619); }
      return hash >>> 0;
    }
    function seededRandom(seed) {
      let value = seed >>> 0;
      return () => {
        value += 0x6D2B79F5;
        let t = value;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    function newRoom(kind, opponent) {
      const id = `${kind.toUpperCase()}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
      return { id, opponentId: opponent.id, opponentName: opponent.name, opponentAvatar: opponent.avatar, opponentLoadout: kind === "ft" ? "月刃 + 影鳞甲" : "泡泡炮 + 星光斗篷", playerReady: false, opponentReady: false };
    }
    function simulateOpponentTurn(kind, text) {
      const current = state[kind];
      const battle = current.battle;
      const rng = seededRandom(hashString(battle.seed + ":" + battle.step));
      const damage = kind === "ft" ? 8 + Math.floor(rng() * 12) : rng() > .26 ? 9 + Math.floor(rng() * 15) : 0;
      battle.step += 1;
      if (damage > 0) {
        battle.youHp = Math.max(0, battle.youHp - damage);
        battle.log.unshift(`<strong>${current.room.opponentName}</strong> ${text || "发动攻击"}，你受到 <strong>${damage}</strong> 点伤害。`);
      } else {
        battle.log.unshift(`<strong>${current.room.opponentName}</strong> 的攻击被你闪开了。`);
      }
      battle.turn = "you";
      if (battle.youHp <= 0) finishBattle(kind, false);
    }
    function finishBattle(kind, win) {

      persist("双方已准备，正在进入同步战斗");
    }
    function resetKind(kind) {
      state[kind] = clone(defaultState[kind]);
    }

    function drawCanvas() {
      const canvas = document.getElementById("arenaCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const isShoot = route() === "/shoot";
      const current = isShoot ? state.shoot : state.ft;
      const battle = current.battle;
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      if (isShoot) {
        const gradient = ctx.createLinearGradient(0, 0, w, h);
        gradient.addColorStop(0, "#101b38"); gradient.addColorStop(1, "#143d4e");
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(122,230,255,.11)"; ctx.lineWidth = 1;
        for (let x = 0; x < w; x += 42) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
        for (let y = 0; y < h; y += 42) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
        ctx.fillStyle = "rgba(101,227,190,.15)"; ctx.fillRect(88, 66, 170, 248);
        ctx.fillStyle = "rgba(255,112,140,.14)"; ctx.fillRect(w - 258, 66, 170, 248);
        drawTarget(ctx, 185, 190, "#7ff0cf", selectedCat().emoji);
        drawTarget(ctx, w - 185, 190, "#ff8ea8", current.room.opponentAvatar);
        ctx.strokeStyle = "rgba(255,255,255,.26)"; ctx.setLineDash([6, 9]); ctx.beginPath(); ctx.moveTo(270, 190); ctx.lineTo(w - 270, 190); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = "#a7efff"; ctx.font = "700 12px system-ui"; ctx.fillText("RANGE 07 · LOW LATENCY", 28, 28);
        ctx.fillStyle = "#7e8cad"; ctx.font = "11px ui-monospace"; ctx.fillText("client interpolation: ON", 28, h - 22);
        ctx.fillStyle = "#7e8cad"; ctx.fillText("room state: SHARED", w - 147, h - 22);
      } else {
        const gradient = ctx.createLinearGradient(0, 0, w, h);
        gradient.addColorStop(0, "#171439"); gradient.addColorStop(1, "#25204a");
        ctx.fillStyle = gradient; ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = "rgba(182,159,255,.13)"; ctx.lineWidth = 2;
        for (let x = 0; x < w; x += 56) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 100, h); ctx.stroke(); }
        ctx.fillStyle = "rgba(134,113,255,.15)"; ctx.beginPath(); ctx.arc(185, 198, 86, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255,129,153,.12)"; ctx.beginPath(); ctx.arc(w - 185, 198, 86, 0, Math.PI * 2); ctx.fill();
        drawCatBattle(ctx, 185, 194, selectedCat().emoji, "#a795ff", true);
        drawCatBattle(ctx, w - 185, 194, current.room.opponentAvatar, "#ff8ea8", false);
        ctx.fillStyle = "#c8c0ff"; ctx.font = "800 12px system-ui"; ctx.fillText("STARFALL RING · SYNCHRONIZED", 28, 28);
        ctx.fillStyle = "#7e87ad"; ctx.font = "11px ui-monospace"; ctx.fillText(`turn ${battle ? battle.step + 1 : 1} · deterministic PRNG`, 28, h - 22);
        ctx.fillText("rollback guard: ARMED", w - 164, h - 22);
      }
    }
    function drawTarget(ctx, x, y, color, emoji) {
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, 54, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, 36, 0, Math.PI * 2); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 70, y); ctx.lineTo(x + 70, y); ctx.moveTo(x, y - 70); ctx.lineTo(x, y + 70); ctx.stroke();
      ctx.font = "31px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(emoji, x, y); ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
    }
    function drawCatBattle(ctx, x, y, emoji, color, you) {
      ctx.fillStyle = color; ctx.globalAlpha = .17; ctx.beginPath(); ctx.arc(x, y, 75, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x - 45, y - 42); ctx.lineTo(x - 60, y - 81); ctx.lineTo(x - 18, y - 63); ctx.moveTo(x + 45, y - 42); ctx.lineTo(x + 60, y - 81); ctx.lineTo(x + 18, y - 63); ctx.stroke();
      ctx.fillStyle = "#272447"; ctx.beginPath(); ctx.arc(x, y, 54, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = color; ctx.stroke();
      ctx.font = "37px system-ui"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(emoji, x, y + 4); ctx.textAlign = "start"; ctx.textBaseline = "alphabetic";
      ctx.fillStyle = color; ctx.font = "800 11px system-ui"; ctx.fillText(you ? "YOU" : "OPPONENT", x - 28, y + 90);
    }

    function handleAction(action, el) {
      if (action === "go") return go(el.dataset.route);
      if (action.startsWith("go:")) return go(action.slice(3));
      if (action === "reset-demo") {
        localStorage.removeItem(STORAGE_KEY); state = clone(defaultState); showToast("演示数据已重置"); render(); return;
      }
      if (action === "open-loadout") { state.modal = { tab: "cat" }; render(); return; }
      if (action === "close-modal") { state.modal = null; render(); return; }
      if (action === "modal-tab") { state.modal = { tab: el.dataset.tab }; render(); return; }
      if (action === "select-modal-cat") { state.selectedCat = el.dataset.cat; persist("已切换出战猫咪"); state.modal = { tab: "cat" }; render(); return; }
      if (action === "select-equipment") {
        state.loadout[el.dataset.kind] = el.dataset.value;
        state.loadout[el.dataset.kind + "Emoji"] = el.dataset.emoji;
        persist("装备配置已同步"); state.modal = { tab: "equipment" }; render(); return;
      }
      if (action === "select-opponent") { showToast(`已锁定 ${playerById(el.dataset.player)?.name || "对手"}，点击大厅卡片发起挑战`); return; }
      if (action === "open-codex") { state.modal = { tab: "codex" }; renderCodexModal(); return; }
      if (action === "open-profile") { showToast("这是你的在线实例：所有场景共享同一账号"); return; }
      if (action === "visit-player") {
        const player = playerById(el.dataset.player);
        if (player) showToast(`已进入 ${player.name} 的 ${player.scene} · 场景内玩家可见`);
        return;
      }
      if (action === "feed-cat" || action === "bathe-cat" || action === "heal-cat") return careCat(action, el.dataset.cat);
      if (action === "place-furniture") { showToast("家具摆放模式已打开：原型中家具布局持久化在当前账号"); return; }
      if (action === "single-player-ft" || action === "single-player-shoot") { showToast("单机入口保留：此原型以 PvP 主流程为演示重点"); return; }
      if (action === "challenge-ft") return challenge("ft", el.dataset.player);
      if (action === "challenge-shoot") return challenge("shoot", el.dataset.player);
      if (action === "accept-ft" || action === "accept-shoot") return accept(action.startsWith("accept-ft") ? "ft" : "shoot");
      if (action === "dismiss-ft" || action === "dismiss-shoot") { const kind = action.includes("ft") ? "ft" : "shoot"; state[kind].incoming = null; persist("已忽略挑战"); render(); return; }
      if (action === "simulate-ft-accept" || action === "simulate-shoot-accept") return simulateAccept(action.includes("ft") ? "ft" : "shoot");
      if (action === "cancel-ft" || action === "cancel-shoot") { const kind = action.includes("ft") ? "ft" : "shoot"; state[kind].outgoing = null; persist("已取消挑战"); render(); return; }
      if (action === "ft-ready" || action === "shoot-ready") return ready(action.includes("ft") ? "ft" : "shoot", true);
      if (action === "ft-opponent-ready" || action === "shoot-opponent-ready") return ready(action.includes("ft") ? "ft" : "shoot", false);
      if (action === "ft-attack") return ftAction("attack");
      if (action === "ft-defend") return ftAction("defend");
      if (action === "ft-skill") return ftAction("skill");
      if (action === "shoot-fire") return shootAction("fire");
      if (action === "shoot-reload") return shootAction("reload");
      if (action === "shoot-shield") return shootAction("shield");
      if (action === "ft-return-lobby") { resetKind("ft"); persist("已安全回到格斗大厅"); render(); return; }
      if (action === "shoot-return-lobby") { resetKind("shoot"); persist("已安全回到射击大厅"); render(); return; }
      if (action === "noop") return;
    }

    function careCat(action, catId) {
      const cat = state.cats.find(item => item.id === catId);
      if (!cat) return;
      if (action === "feed-cat") {
        if (state.resources.food <= 0) return showToast("猫粮不足");
        state.resources.food -= 1; cat.happy = Math.min(100, cat.happy + 12); cat.hp = Math.min(100, cat.hp + 3); persist(`${cat.name} 吃饱了，心情 +12`); 
      } else if (action === "bathe-cat") {
        if (state.resources.soap <= 0) return showToast("肥皂不足");
        state.resources.soap -= 1; cat.clean = Math.min(100, cat.clean + 24); cat.happy = Math.max(0, cat.happy - 1); persist(`${cat.name} 香喷喷，清洁度 +24`);
      } else {
        if (state.resources.medicine <= 0) return showToast("药品不足");
        state.resources.medicine -= 1; cat.hp = Math.min(100, cat.hp + 20); persist(`${cat.name} 恢复了 20 点生命`);
      }
      render();
    }

    function challenge(kind, playerId) {
      const current = state[kind];
      if (current.stage !== "lobby" || current.outgoing) return;
      const opponent = playerById(playerId);
      if (!opponent) return;
      current.outgoing = { id: `${kind.toUpperCase()}-${Math.random().toString(36).slice(2, 7).toUpperCase()}`, toId: opponent.id, toName: opponent.name };
      persist(`已向 ${opponent.name} 发起挑战`);
      render();
    }
    function accept(kind) {
      const current = state[kind];
      const incoming = current.incoming;
      if (!incoming) return;
      const opponent = playerById(incoming.fromId) || { id: incoming.fromId, name: incoming.fromName, avatar: incoming.fromAvatar };
      current.incoming = null;
      current.room = newRoom(kind, opponent);
      current.stage = "picks";
      persist("已接受挑战，进入 PICKS 选择配置");
      render();
    }
    function simulateAccept(kind) {
      const current = state[kind];
      if (!current.outgoing) return;
      const opponent = playerById(current.outgoing.toId);
      current.room = newRoom(kind, opponent || { id: current.outgoing.toId, name: current.outgoing.toName, avatar: "🐈" });
      current.outgoing = null; current.stage = "picks";
      persist("对手已接受，双方进入 PICKS");
      render();
    }
    function ready(kind, mine) {
      const current = state[kind];
      if (!current.room) return;
      if (mine) current.room.playerReady = true; else current.room.opponentReady = true;
      persist(mine ? "你的配置已锁定" : "对手已准备");
      if (current.room.playerReady && current.room.opponentReady) startBattle(kind);
      render();
    }
    function ftAction(action) {
      const battle = state.ft.battle;
      if (!battle || battle.turn !== "you") return;
      const rng = seededRandom(hashString(battle.seed + ":" + battle.step));
      battle.step += 1;
      let damage = 0; let text = "";
      if (action === "attack") { damage = 14 + Math.floor(rng() * 15); text = "使用爪击"; }
      if (action === "skill") { damage = 20 + Math.floor(rng() * 18); text = "释放星尘技能"; }
      if (action === "defend") { damage = 4 + Math.floor(rng() * 8); battle.defending = true; text = "进入防御姿态"; }
      battle.enemyHp = Math.max(0, battle.enemyHp - damage);
      battle.log.unshift(`<strong>${state.user.name}</strong> ${text}，造成 <strong>${damage}</strong> 点伤害。`);
      if (battle.enemyHp <= 0) return finishBattle("ft", true), render();
      battle.turn = "enemy"; render();
      setTimeout(() => { if (state.ft.stage === "battle") { simulateOpponentTurn("ft"); persist(); render(); } }, 380);
    }
    function shootAction(action) {
      const battle = state.shoot.battle;
      if (!battle || battle.turn !== "you") return;
      const rng = seededRandom(hashString(battle.seed + ":" + battle.step));
      battle.step += 1;
      if (action === "fire") {
        if (rng() > .27) {
          const damage = 18 + Math.floor(rng() * 21);
          battle.enemyHp = Math.max(0, battle.enemyHp - damage);
          battle.log.unshift(`<strong>${state.user.name}</strong> 命中目标，造成 <strong>${damage}</strong> 点伤害。`);
        } else battle.log.unshift(`<strong>${state.user.name}</strong> 射击落空，目标完成位移。`);
      }
      if (action === "reload") battle.log.unshift(`<strong>${state.user.name}</strong> 完成换弹，下一发命中率提升。`);
      if (action === "shield") { battle.defending = true; battle.log.unshift(`<strong>${state.user.name}</strong> 展开护盾，本回合受到的伤害降低。`); }
      if (battle.enemyHp <= 0) return finishBattle("shoot", true), render();
      battle.turn = "enemy"; render();
      setTimeout(() => { if (state.shoot.stage === "battle") { simulateOpponentTurn("shoot", "开火"); persist(); render(); } }, 380);
    }

    function renderCodexModal() {
      const wrap = document.createElement("div");
      wrap.innerHTML = `<div class="modal-backdrop" data-action="close-modal"><div class="modal" onclick="event.stopPropagation()"><div class="modal-head"><h2>图鉴与成就</h2><button class="close" data-action="close-modal">×</button></div><div class="modal-body"><div class="grid-3"><div class="card card-pad"><div style="font-size:30px">🐾</div><h3>猫咪图鉴</h3><p class="muted" style="font-size:11px">${state.codex.unlocked} / ${state.codex.total} 已解锁</p></div><div class="card card-pad"><div style="font-size:30px">🪑</div><h3>家具图鉴</h3><p class="muted" style="font-size:11px">18 / 40 已收集</p></div><div class="card card-pad"><div style="font-size:30px">🏆</div><h3>竞技成就</h3><p class="muted" style="font-size:11px">7 / 24 已完成</p></div></div><div class="modal-footer"><p>图鉴数据与猫娘 API 配置均属于账号级数据。</p>${button("知道了", "close-modal", "primary")}</div></div></div></div>`;
      document.body.insertAdjacentHTML("beforeend", wrap.innerHTML);
      state.modal = { tab: "codex" };
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      event.preventDefault();
      const action = target.dataset.action;
      if (action.startsWith("go:")) return handleAction(action, target);
      handleAction(action, target);
    });
    window.addEventListener("hashchange", render);
    window.addEventListener("storage", event => {
      if (event.key === STORAGE_KEY) { state = loadState(); render(); showToast("检测到其他设备同步"); }
    });
    if (!location.hash) location.hash = "/";
    render();
  </script>
</body>
</html>
